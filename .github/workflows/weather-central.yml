name: Weather Central (test mode)

on:
  workflow_dispatch:
  schedule:
    # Daily at 14:15 UTC; scheduled starts can be delayed by GitHub.
    - cron: '15 14 * * *'

permissions:
  contents: read

concurrency:
  group: weather-central-video
  cancel-in-progress: false

jobs:
  render-test-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch, validate, and render test video
        run: python weather_central.py --output output/weather-central.mp4
      - name: Upload test video and manifest
        if: "${{ always() && hashFiles('output/**') != '' }}"
        uses: actions/upload-artifact@v4
        with:
          name: weather-central-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm no public upload occurred
        run: echo 'TEST MODE: no YouTube upload step is configured.'
